    <h1>守夜的更夫说，打更打到十三下就别再数了</h1>
    <p>一夜只有五更，多出来的那一更，是敲给另一拨人听的</p>
    <img class="cover" src="../covers/054.png" alt="守夜的更夫说，打更打到十三下就别再数了封面">
    <audio controls preload="metadata" src="../audio/054_night_watchman_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>我爷爷年轻时在镇上打更。他说打更有规矩：一夜五更，从一更到五更，敲的梆子数加起来，是有定数的。可有些夜里，五更过后，那梆子声还会响，一直数下去。爷爷的师父告诉他：要是听见更声敲过了十三下，无论如何，都别再跟着数，更别应声。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
