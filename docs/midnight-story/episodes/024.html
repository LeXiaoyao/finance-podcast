    <h1>我家防盗门的猫眼，半夜外面有人也在往里看</h1>
    <p>猫眼是用来往外看的，可它也能往里看</p>
    <img class="cover" src="../covers/024.png" alt="我家防盗门的猫眼，半夜外面有人也在往里看封面">
    <audio controls preload="metadata" src="../audio/024_peephole_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>独居的女生都怕半夜的敲门声。我也是。可比敲门更让我害怕的，是那天深夜，我凑到猫眼往外看时，看见外面那只眼睛，也正贴着猫眼，往里看我。它和我，做着一模一样的动作。后来我才知道，猫眼这东西，本来就是双向的——你能看见外面，外面的东西，有时候也能看见你。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
