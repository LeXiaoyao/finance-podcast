    <h2>简介</h2>
    <p>奶奶在世时常叮嘱我一句话：要是在梦里，有人很热情地请你吃饭，满桌好菜，无论你多饿，筷子千万别动。她说，那不是普通的梦，那是另一头摆的席。在那张桌上吃了东西，你这一觉，就再也醒不过来了。那年我大病一场，高烧不退，真的梦见了那样一桌饭。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
