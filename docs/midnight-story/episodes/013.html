    <h1>扎纸店接了笔急活，纸人的脸要照着活人扎</h1>
    <p>纸人本来没有脸，谁给了它脸，它就替谁去</p>
    <img class="cover" src="../covers/013.png" alt="扎纸店接了笔急活，纸人的脸要照着活人扎封面">

    <h2>简介</h2>
    <p>师父开了一辈子扎纸店。他教我的第一条规矩是：纸人的脸，只能画样子，绝不能照着哪个活人扎。那年腊月，一个夜里来的主顾下了笔急活，出三倍的价，只有一个要求——纸人的脸，要照着一张照片上的人扎。师父没接，我贪那笔钱，偷偷接了。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
