    <p>沈砚夜探旧水道遭围杀，谢兰舟出手相救却拒绝解释行踪</p>

    <h2>简介</h2>
    <p>沈砚根据三把伞的影图，夜探红叶渡旧水道。他刚确认暗渠通向沈家堡旧路，便遭黑衣人围杀。危急时刻，谢兰舟以白衣盟剑法救下沈砚，却不肯解释为何提前埋伏在江上。沈砚开始意识到，谢兰舟也在查一条不愿公开的线。</p>
