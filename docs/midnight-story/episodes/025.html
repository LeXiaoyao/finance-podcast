    <img class="cover" src="../covers/025.png" alt="外卖备注栏自己多了一行字：这次别开门封面">

    <h2>简介</h2>
    <p>我点的夜宵外卖，备注栏里多了一行我没写过的字：这次别开门，放门口就好。我以为是手滑，没在意。可接下来每一单，备注栏都会自己多出一句话，像有人在替我留言。直到有一天，那行字变成了：今晚谁敲门都别开，尤其是我。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
