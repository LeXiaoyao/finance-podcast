    <h2>简介</h2>
    <p>裴无咎交出一册旧军医手札，记载十七年前边军曾借一种封脉针救伤兵。温令仪认出其中针法来自药王谷禁术，既能救命，也能伪造死亡。罗敬与陈守义身上的针痕，第一次和十七年前的军医体系连在一起。</p>
