    <h1>精神科值夜，五号病房的病人说窗外站着我</h1>
    <p>病人没疯，他只是看得见你身后那个</p>
    <img class="cover" src="../covers/046.png" alt="精神科值夜，五号病房的病人说窗外站着我封面">
    <audio controls preload="metadata" src="../audio/046_psych_ward_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>我在精神科做夜班医生。五号病房有个老病人，平时安安静静。可那阵子，他每晚都指着窗户，对我说同一句话：医生，你身后窗外，站着一个你。起初我以为是他的幻觉。直到那晚我回头，看见漆黑的窗玻璃上，我的倒影，比我，慢了半秒。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
