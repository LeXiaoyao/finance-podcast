    <h2>简介</h2>
    <p>表姐结婚，婚房是新买的二手房。新婚第一夜，喜被铺得整整齐齐。可第二天早上，那床大红喜被，被叠成了一种很老的、四四方方的样式，是几十年前姑娘出嫁前，压箱底的叠法。没有人动过它。婚房里，还住着一位，不肯把位子让出来的旧主人。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
