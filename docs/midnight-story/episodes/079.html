    <h2>简介</h2>
    <p>柳照寒袖中“井”字指向后山枯井，周掌柜极力阻拦。沈砚暂缓赴井，先回房复核屋梁。他在梁上找到极细雪泥和衣料压痕，确认柳照寒尸身曾被人从上方移动。密室的第一层手法，终于开始成形。</p>
