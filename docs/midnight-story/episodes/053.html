    <h1>山神庙的签，连抽三次都是同一支下下签</h1>
    <p>签不是吓你，是有人非要你看见这句话</p>
    <img class="cover" src="../covers/053.png" alt="山神庙的签，连抽三次都是同一支下下签封面">
    <audio controls preload="metadata" src="../audio/053_temple_lot_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>我去深山一座老山神庙还愿，顺手摇了一签。摇出来是支下下签，签文我看不懂。我不信，把签放回去，重新摇，又是同一支。一连三次，整签筒几十支签，我偏偏每次都摇出那一支。守庙的老人说，不是你运气差，是有人，非要你，看见签上那句话。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
