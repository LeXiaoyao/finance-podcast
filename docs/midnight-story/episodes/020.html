    <h2>简介</h2>
    <p>奶奶一辈子纳鞋底，针线活村里第一。她给全家人都纳过鞋，唯独有一双，纳了大半辈子，总也纳不完。她说那双是给她自己留的，等纳完最后一针，就该上路了。奶奶走的前几天，那双鞋，悄悄纳完了最后一针。可纳完它的，不是奶奶。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
