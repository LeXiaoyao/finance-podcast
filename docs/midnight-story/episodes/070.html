    <p>沈砚重新查看红叶玉佩，发现它断裂的地方，一半新，一半旧</p>

    <h2>简介</h2>
    <p>顾伯失踪后，沈砚把所有线索重新摆回桌上：门闩细线、湿炉灰、屋顶霜瓦、血衣墨印，以及那半枚红叶玉佩。他发现玉佩断口并不一致，像是多年以前断过一次，最近又被人重新切开。红叶并非单纯信物，它可能原本就是一对。</p>
