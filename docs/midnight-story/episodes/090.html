    <p>断云驿命案第一层告一段落。沈砚没有完全破案，却拿到了足够多的线索：红叶玉佩、半句诗、青灯铜牌、边关军图。三日之约将至，他决定赴江南红叶渡。温令仪同行，谢兰舟也跟上。真正的旧案，才刚刚露出水面。</p>
