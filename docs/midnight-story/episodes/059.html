    <h1>老家拆迁那天，墙缝里掉出一张我的生辰八字</h1>
    <p>你以为你是你，可你的八字，早被人换了一次</p>

    <h2>简介</h2>
    <p>老家的祖屋要拆迁。拆墙那天，从一道砖缝里，掉出一个红布包。打开一看，里面是一张发黄的纸，写着一个人的生辰八字——日子，正是我的生日。可那个名字，不是我。奶奶看见那张纸，老泪纵横，说出了一个，瞒了我三十年的秘密。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
