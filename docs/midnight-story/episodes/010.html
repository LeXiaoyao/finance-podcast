    <h2>简介</h2>
    <p>山里有一种夜集，只在阴历月底没有月亮的夜晚，开在山坳里的老渡口边。集上什么都卖，价钱便宜得不像话。爷爷带我去过一次，临走前反复叮嘱：可以看，可以买，但买东西一定要给钱，绝不能收别人白送的东西。因为夜集的规矩是——收了谁的东西，就得拿自己，去还谁。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
