    <p>每一个深夜听故事的你，也是这家铺子的一部分</p>

    <h2>简介</h2>
    <p>讲了五十九个故事，我从没说过自己是谁。这是第一季的最后一夜。打烊前，我想跟你聊聊这家午夜故事铺，聊聊我自己。其实，我也不太记得，是从什么时候开始，坐在这里讲故事的。那天深夜，我翻看后台，发现一件事——这家铺子里，讲故事的人，从来，不止我一个。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
