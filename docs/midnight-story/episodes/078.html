    <h1>长夜不录：半句诗</h1>
    <p>柳照寒袖中藏着半句诗，像遗言，也像一封没有写完的情书</p>
    <img class="cover" src="../covers/078.png" alt="长夜不录：半句诗封面">
    <audio controls preload="metadata" src="../audio/078_half_poem_yunjian_final.mp3"></audio>
    <h2>简介</h2>
    <p>顾伯中毒而死，第二个知情人灭口。沈砚重新翻检柳照寒遗物，在袖中发现一张被汗水浸皱的纸条，上面只有半句诗：长夜不录，故人不归。诗句像遗言，也像柳照寒赴死前留给某个人的最后提醒。</p>
