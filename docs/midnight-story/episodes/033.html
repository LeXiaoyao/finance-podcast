    <p>那道线不是警戒线，是它要上来的线</p>

    <h2>简介</h2>
    <p>我接替老周，做了水库的夜班管理员。交接那晚，老周指着大坝内壁一道发暗的旧刻线，反复叮嘱我：暴雨天涨水，水位千万不能到这道线。一旦到了，立刻开闸泄洪，把水放下去，多晚都不能等。他没说原因。直到那个暴雨夜，水位一寸寸逼近刻线，我才听见，水底下，有人在数数。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
