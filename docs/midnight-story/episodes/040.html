    <h2>简介</h2>
    <p>老家拆旧谷仓，工人在地基底下，挖出一口大缸。缸口用厚厚的黄泥封着，泥上贴着一道发黑的旧符，符上歪歪扭扭写着两个字：别开。我爷爷在世时从没提过这口缸。村里最老的人看了一眼，连退三步，说这缸是先人拿命封下去的，谁也不能开。可那天夜里，那口缸，自己，从里面，顶开了。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
