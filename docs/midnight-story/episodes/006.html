    <p>外婆的老宅里有一面祖传的梳妆镜，她活着时，每到天黑就用黑布把镜子蒙上。外婆走后我搬回老宅，掀开了那块布。起初我只是觉得镜子干净得反常，后来才发现，镜子里的那个我，每一个动作都比我慢半拍——直到有一晚，它先动了。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
