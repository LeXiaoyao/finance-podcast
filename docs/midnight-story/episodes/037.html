    <h1>老家那块自留地，每年都会自己多出一座坟</h1>
    <p>那些坟一年比一年近，是在往屋门口排队</p>
    <img class="cover" src="../covers/037.png" alt="老家那块自留地，每年都会自己多出一座坟封面">
    <audio controls preload="metadata" src="../audio/037_extra_grave_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>我家老宅后面有块自留地，种着菜。奇怪的是，地里每年都会自己多出一个小土包，像座小坟。爷爷从不让人去动它们，只是每年清明，多烧一份纸。我数过，那些土包，一年比一年多，而且，正一排一排，朝着我家后门，慢慢地，靠过来。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
