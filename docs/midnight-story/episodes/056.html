    <h1>我妈织毛衣总要多留一只袖子，说给"那个孩子"</h1>
    <p>家里一直有个空位，留给那个没能长大的人</p>
    <img class="cover" src="../covers/056.png" alt="我妈织毛衣总要多留一只袖子，说给"那个孩子"封面">
    <audio controls preload="metadata" src="../audio/056_extra_sleeve_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>从我记事起，我妈织毛衣就有个怪习惯：每件织好的毛衣，她都会再多织一只单独的袖子，叠好，收进衣柜最底层。我问她给谁的，她总说，给"那个孩子"。我家就我一个孩子。直到奶奶临终前，才告诉我，在我之前，我妈还有过一个孩子。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
