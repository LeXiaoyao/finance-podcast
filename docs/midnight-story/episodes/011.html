    <p>照片记得所有回过家的人，包括那些不该再回来的</p>
    <img class="cover" src="../covers/011.png" alt="爷爷的全家福，每年清明都会多出一个人封面">
    <audio controls preload="metadata" src="../audio/011_family_photo_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>爷爷家堂屋挂着一张老全家福，黑白的，照于几十年前。从我记事起，每年清明回去，我都觉得照片上的人好像比上一年多。家里人都说我记错了。直到那年清明，我把历年翻拍的照片排在一起，才发现多出来的那个人，正一年一年，从最后一排，慢慢挪向爷爷坐着的中间。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
