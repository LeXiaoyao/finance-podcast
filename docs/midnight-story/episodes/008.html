    <h2>简介</h2>
    <p>小林是医院透析中心的夜班技师，负责在没有病人的深夜看护那一排机器。带他的老技师只交代一件事：三号机停用了，别去碰，更别去修。可那天凌晨，已经断电封存的三号机，屏幕自己亮了，泵也自己转了起来——它正在给一个不存在的病人，做一场早就结束的透析。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
