    <h2>简介</h2>
    <p>我读小学时，后山有个废弃的防空洞，洞口有一段往下的石台阶。学校三令五申不许进，可男孩子总好奇。带我们的老校工说，那台阶你们要是非下，记住，数到三十三级，就一定要停，绝不能数到第三十四级。因为这洞，本来就只有三十三级台阶。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
