    <h1>老戏台年年唱一出无人点的戏，台下却坐满了人</h1>
    <p>那出戏不是唱给活人听的，散场前别回头看观众</p>
    <img class="cover" src="../covers/055.png" alt="老戏台年年唱一出无人点的戏，台下却坐满了人封面">

    <h2>简介</h2>
    <p>我们村有座老戏台，每年中元节，戏班子都要来唱一场。可有一出戏，没人点，戏班却年年必唱，唱给空荡荡的台下。那年我好奇，半夜偷偷去看。戏台灯火通明，台下黑压压坐满了人。爷爷把我拽走时只说了一句：那出戏散场前，千万别回头看台下的观众。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
