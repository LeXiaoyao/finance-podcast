    <p>庙小，可它留客</p>

    <h2>简介</h2>
    <p>进山的老道上，有一座很小的土地庙。赶山的人路过，都习惯进去上炷香。我爷爷年轻时跑山货，他说那座庙有个忌讳：一行人进去上香，出来时一定要清点人数，因为进去的人，常常比出来的多一个。多出来的那一个，从来不是凭空出现，而是从你们当中，悄悄换走一个。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
