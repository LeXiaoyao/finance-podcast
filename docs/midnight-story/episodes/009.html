    <h1>给老人守灵的第三夜，我发现这一夜，过了三遍</h1>
    <p>守灵守的不是人，是别让该走的那个人，又走回来</p>

    <h2>简介</h2>
    <p>按老家的规矩，老人过世要守三夜灵，灵前的长明灯不能灭，守灵的人不能睡。轮到我守第三夜时，我盯着墙上的挂钟熬到了天快亮。可鸡叫之后，天没有亮。挂钟又一格一格，倒回了昨夜的开头。这一夜，我守了三遍，每一遍，棺材里的爷爷，都比上一遍离我更近一点。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
