    <h1>宿舍熄灯后，上铺总比我们多翻一个身</h1>
    <p>六个人的宿舍，熄灯后，总能数出第七个呼吸</p>
    <img class="cover" src="../covers/042.png" alt="宿舍熄灯后，上铺总比我们多翻一个身封面">
    <audio controls preload="metadata" src="../audio/042_dorm_bunk_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>我们宿舍六个人，三张上下铺。每晚熄灯后，躺在床上，总能听见多出来的动静——明明是六个人，翻身的声音，呼吸的声音，却像有七个。我们都装作没听见。直到那晚查寝，宿管阿姨数人头，数来数去，床上躺着七个人，可花名册上，只有六个名字。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
