    <h1>救护车司机说，回程车上有时会多一个病人</h1>
    <p>没接到的那一趟，它自己上了车</p>
    <img class="cover" src="../covers/048.png" alt="救护车司机说，回程车上有时会多一个病人封面">
    <audio controls preload="metadata" src="../audio/048_ambulance_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>我开救护车，跑院前急救。这行有个说法：去的时候车上几个人，回来时最好也是几个人。可有些深夜出的车，明明病人没救回来，回程的担架上，却像还躺着一个人。老搭档教我一招：回到医院，下车前，一定要回头，对着空担架，说一句"到了，您该下车了"。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
