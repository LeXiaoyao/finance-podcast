    <h1>童年那个"看不见的朋友"，三十年后又来敲门</h1>
    <p>你忘了的约定，它替你记了三十年</p>
    <img class="cover" src="../covers/047.png" alt="童年那个"看不见的朋友"，三十年后又来敲门封面">
    <audio controls preload="metadata" src="../audio/047_imaginary_friend_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>小时候，我有一个"看不见的朋友"，叫阿照。我们一起玩，无话不说。搬家那天，阿照让我答应他，长大后一定回老房子找他，我随口应了。三十年过去，我早把这事忘得一干二净。直到那天深夜，我家门被敲响，门外一个声音说：你答应过的，怎么不来找我。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
