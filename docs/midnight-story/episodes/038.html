    <h2>简介</h2>
    <p>我们村旱了三年，颗粒无收。老人们决定，按祖上传下来的法子，举行求雨仪式。仪式很灵，当夜就电闪雷鸣，下了一场大雨。全村人都跪在雨里，又哭又笑。可第二天，怪事来了——那场雨淋过的人，开始一个接一个，叫着别人的名字，说着别人的话。求雨求来的，不只是雨。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
