    <h1>渔村规矩，网到穿衣服的东西要原样放回去</h1>
    <p>大海给你的，不一定是让你留下的</p>
    <img class="cover" src="../covers/032.png" alt="渔村规矩，网到穿衣服的东西要原样放回去封面">

    <h2>简介</h2>
    <p>我外公是渔民，出海一辈子。他教过我一条渔村铁律：出海打鱼，要是网里捞上来穿着衣服的东西，不管是什么，都要原样放回海里，还要烧三炷香赔个不是。那年休渔期刚过，邻船的阿强不信邪，把网上来的东西带回了家。从那以后，他家的水缸，半夜总有人在里面，吐水。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
