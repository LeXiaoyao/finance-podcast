    <h2>简介</h2>
    <p>沈砚夜寻卢怀慎，江心白灯船无声停泊。对岸忽然传来琴声，节奏像谢兰舟惯用的江湖传讯，却又故意错开半拍。谢兰舟听出那不是给他的信号，而是给船上的人。沈砚登船后，发现卢怀慎已经不见，船舱里只剩一把湿透的青纸伞。</p>
