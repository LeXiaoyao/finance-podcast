    <h1>村口老井每年七月封起来，老人说井里会喊人</h1>
    <p>井口封住的是水，也是那些想上来的人</p>
    <img class="cover" src="../covers/004.png" alt="村口老井每年七月封起来，老人说井里会喊人封面">
    <audio controls preload="metadata" src="../audio/004_old_well_yunxi_enhanced.mp3"></audio>
    <h2>简介</h2>
    <p>村口有口老井，每年七月都要用石板封住。老人说，封井那晚，谁听见井里有人叫你，都不能答应。少年阿青不信，偷偷掀开石板往下看了一眼，从此村里每一户人家的水缸，都映出同一张脸。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
