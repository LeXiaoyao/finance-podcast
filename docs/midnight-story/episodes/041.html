    <h1>儿科夜班，那张空床的呼叫铃总在三点响</h1>
    <p>那个小孩不要别的，他只是想找回自己的鞋</p>

    <h2>简介</h2>
    <p>我是儿科的夜班护士。病区最里面的12床，一直空着，没安排病人。可每天凌晨三点，护士站的呼叫器，总会亮起12床的灯。我过去看，永远是空的。带我的老护士长说，别怕，那是个找鞋的小孩，你帮他找到那双鞋，他就不闹了。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
