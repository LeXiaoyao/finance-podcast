    <h2>简介</h2>
    <p>柳照寒死于反锁房中，身上无伤，掌心握着红叶玉佩。沈砚封锁断云驿，开始第一轮问话。可他很快发现，驿站里的人证词并非互相印证，而是彼此撕裂：有人听见脚步从东来，有人听见脚步往西去，有人说三更后无人上楼，也有人说死者曾在窗前站过。</p>
