    <h2>简介</h2>
    <p>青灯铜牌让线索连向青灯寺、枯井和红叶渡。沈砚趁雪未停，复原柳照寒密室：门闩细线、醒魂丹、纸窗影、梁上衣架、封脉延死。可当手法逐渐清楚，他发现凶手真正要藏的并不是怎样杀人，而是柳照寒为什么必须来到断云驿。</p>
