    <h2>简介</h2>
    <p>老家堂屋的供桌上，常年摆着三个苹果，敬祖先的。奶奶有条死规矩：供桌上的东西，撤下来之前，谁也不许碰，更不许吃。表弟不信邪，趁人不注意咬了一口。那个苹果他没吃完，咬过的缺口，第二天开始发黑。可发黑的，不只是那个苹果。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
