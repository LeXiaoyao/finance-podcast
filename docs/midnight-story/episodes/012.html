    <p>有些人买了票，却不是为了到站</p>
    <img class="cover" src="../covers/012.png" alt="夜车卧铺对面那个人，三天三夜没下过铺封面">
    <audio controls preload="metadata" src="../audio/012_sleeper_train_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>那年我坐了三天三夜的绿皮火车回西南老家。我对面中铺躺着一个人，从上车起就背朝外躺着，不吃不喝，不上厕所，三天没下过铺。列车员查票查了好几遍，每次都从他身边走过，像没看见他。直到最后一夜，我无意中看了一眼他的车票存根，才发现这趟车上，根本没有他这个座位。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
