    <h2>简介</h2>
    <p>我在殡仪馆做遗体化妆师。带我的张姐干了二十年，她工作台上有一面老镜子，从不让人随便照。她说这面镜子有个怪处：照不出已经走了的人，只照得出还没走、却快了的人。我一直当是玩笑，直到有一天加班，我在那面镜子里，看见了正在低头工作的、活生生的自己。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
