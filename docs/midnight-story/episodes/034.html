    <h1>烧山那天，火里站着一个不怕烧的人</h1>
    <p>你认得出他，可你千万别喊他的名字</p>
    <img class="cover" src="../covers/034.png" alt="烧山那天，火里站着一个不怕烧的人封面">
    <audio controls preload="metadata" src="../audio/034_burning_mountain_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>老家有烧荒的习俗，开春前放一把火，把山坡上的枯草烧掉，来年好种庄稼。烧山那天，全村人都去看火。我在熊熊大火里，看见一个人，站在火中央，一动不动，火烧不着他。我认得他——那是去年上山失踪、一直没找到的二叔。我刚要喊他，爷爷死死捂住了我的嘴。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
