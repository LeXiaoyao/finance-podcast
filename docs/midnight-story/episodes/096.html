    <h2>简介</h2>
    <p>沈砚见到盲伞匠。老人双目已盲，却能凭伞骨声辨出每一把伞的主人。他告诉沈砚，青纸伞不是临时卖给罗敬，而是十年前就有人订下，伞面画什么、伞骨藏什么、何时交到谁手中，都早有安排。</p>
