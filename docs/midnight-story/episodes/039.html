    <h1>摆渡老人只在没有月亮的夜里收最后一个客</h1>
    <p>那一程的船钱，不是钱，是你的一段阳寿</p>
    <img class="cover" src="../covers/039.png" alt="摆渡老人只在没有月亮的夜里收最后一个客封面">
    <audio controls preload="metadata" src="../audio/039_ferryman_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>老渡口有个摆渡的老人，撑了一辈子船。镇上人都知道一个规矩：没有月亮的夜里，他会多撑一趟，收最后一个客。坐了那趟船的人，第二天准会大病一场。我赶夜路误了时辰，鬼使神差上了那趟船。老人没收我船钱，只说：这一程，记你账上，往后，慢慢还。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
