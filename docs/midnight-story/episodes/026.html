    <h1>加班最后一个走，写字楼每层都还亮着一盏灯</h1>
    <p>你以为只剩你一个，其实每层都有人没走</p>

    <h2>简介</h2>
    <p>我在一栋三十多层的写字楼上班，常年加班到深夜。那天我是全公司最后一个走的，坐电梯下楼时，我习惯性地看了眼对面那栋同款写字楼。每一层，都还亮着一盏灯。整整齐齐，一层一盏。第二天我才知道，我们这栋楼，对面，根本没有楼。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
