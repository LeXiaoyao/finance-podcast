    <h2>简介</h2>
    <p>老家修水库，祖坟在淹没区，必须迁走。迁坟那天，请了懂行的先生主持。挖开太爷爷的坟，起棺的时候，怪事发生了——本该只有一具棺木，土里却起出了两具。一具是太爷爷的，另一具，棺木样式陈旧，谁也不认得。先生脸色大变，说，有东西想跟着我们，回家。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
