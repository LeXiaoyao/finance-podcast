    <p>那盏灯不是引你回家，是引你走得更远</p>
    <img class="cover" src="../covers/035.png" alt="雪夜迷路看见的那盏灯，走近了永远差一百步封面">

    <h2>简介</h2>
    <p>那年冬天，我在北方的山里迷了路。天黑，下着大雪，我又冷又怕。就在快撑不住的时候，我看见远处雪地里，有一盏灯。有灯就有人家。我朝那盏灯走，可走了很久，那盏灯始终在远处，像永远差着一百步。多亏一个赶夜路的老猎人拦住了我，他说：跟着雪地里的灯走的人，没有一个，活着走出过这片山。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
