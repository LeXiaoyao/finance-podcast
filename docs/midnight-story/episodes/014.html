    <h2>简介</h2>
    <p>按老家的规矩，人走后第七天是头七，亡人的魂会回家看最后一眼。那一夜全家不能睡在堂屋，要在灶台前撒一层草木灰，第二天看脚印，送魂上路。奶奶走的那年头七，我们撒了灰。可第二天清早，灰上的那双脚印，是倒着的——脚跟朝里，脚尖朝着门外。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
