    <p>墙那边也有人在敲，他想让你知道，他在</p>

    <h2>简介</h2>
    <p>我租的老房子，卧室有面墙，敲起来是空的。我好奇，敲了三下，墙里却回了四下。我又敲，回声永远比我多一下，像墙那边也有人，在跟着我敲，还要多敲一记，告诉我他在。我找房东问那面墙后面是什么，房东支支吾吾地说，那后面，封着一个，本来不该有的房间。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
