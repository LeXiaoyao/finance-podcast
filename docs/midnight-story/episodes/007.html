    <h2>简介</h2>
    <p>城郊有一趟开往终点站的末班公交，司机老郑跑了八年。这趟车的报站器有个怪毛病：每过一站，它播报的在车人数，总比实际多出一个。老郑数过很多遍，从来没数错。直到那个雨夜，他终于忍不住，回头把全车的人，一个一个数到了底。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
