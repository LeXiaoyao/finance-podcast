    <h1>采药人说，崖壁上那丛红果谁摘谁还</h1>
    <p>长在那个地方的东西，是用人喂出来的</p>
    <img class="cover" src="../covers/036.png" alt="采药人说，崖壁上那丛红果谁摘谁还封面">
    <audio controls preload="metadata" src="../audio/036_cliff_berries_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>师父是个老采药人，进山采药一辈子。他带我认遍了山里的草木，唯独有一处绝壁，崖上长着一丛红得发亮的果子，他叮嘱我一辈子都不许去碰。他说那丛红果，谁摘谁还。那年师父病重，缺一味救命的药引，正是那种红果。我背着师父，去摘了。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
