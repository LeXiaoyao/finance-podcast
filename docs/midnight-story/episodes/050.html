    <p>那张床的病人早就出院了，可点滴还在为他续着</p>

    <h2>简介</h2>
    <p>我在内科做夜班护士。靠窗的9床，那位老爷子前一天刚出院。可那天夜里，9床的呼叫铃没响，监护仪却显示，那张空床的输液，还在一滴一滴往下走。我过去看，没有输液瓶，没有针管，可床头那个看不见的地方，分明传来，液体滴落的声音。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
