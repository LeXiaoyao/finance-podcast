    <h1>老照片里的同学，今年同学会他真的来了</h1>
    <p>他缺席了二十年，这一次，他不想再缺席</p>
    <img class="cover" src="../covers/049.png" alt="老照片里的同学，今年同学会他真的来了封面">
    <audio controls preload="metadata" src="../audio/049_reunion_photo_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>毕业二十年，我们组织了一场同学会。班长把当年的毕业合影翻出来，发在群里。照片上有个同学，叫林川，高三那年因病去世了。同学会那天，到场的人，比报名的，多了一个。那个人，坐在角落，二十年没变样。散场后我们才反应过来——林川，他来了。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
