    <h2>简介</h2>
    <p>表哥结婚那天，迎亲的车队是六辆。从女方家出来时，跟车的人却数出了七辆。那多出来的一辆，蒙着红绸，跟在队尾，不快不慢。到了婆家，红绸车里也下来一个穿嫁衣、盖红盖头的新娘。两个新娘，一模一样，没人分得清哪个是真的。老人说，谁先掀错了盖头，谁就把那门亲，认下了。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
