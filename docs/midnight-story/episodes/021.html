    <h1>老楼的电梯半夜停在不存在的负一层</h1>
    <p>有些楼层不在按钮上，可它一直在等电梯下去</p>
    <img class="cover" src="../covers/021.png" alt="老楼的电梯半夜停在不存在的负一层封面">
    <audio controls preload="metadata" src="../audio/021_basement_floor_yunxi_final.mp3"></audio>
    <h2>简介</h2>
    <p>我搬进一栋上世纪的老楼，电梯很旧。楼里只有一层到十八层，没有地下室。可有几次深夜回家，电梯会自己往下沉，停在一个按钮上根本没有的“负一层”。门开的那一瞬间，外面是一条我从没见过的走廊。邻居老太太警告我：电梯停在负一层时，无论如何，都别走出去。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
