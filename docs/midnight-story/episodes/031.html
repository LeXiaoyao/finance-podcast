    <h1>中元节放河灯，捞起别人的灯就接了别人的事</h1>
    <p>河灯顺水走，是去还愿的，谁把它捞起来，谁就替它还</p>

    <h2>简介</h2>
    <p>每年中元节，我们镇上的人都会去河边放河灯，给逝去的亲人引路。奶奶有条规矩：自己的灯放下去，就再也不能碰；河里别人的灯，更是绝对不能捞。那年中元，我贪玩，从水里捞起一盏特别漂亮的河灯。灯底压着一张纸条，上面写着一件，还没了结的事。从那天起，那件事，落到了我头上。本故事为原创虚构民间异闻演绎，请勿代入现实。</p>
